server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API and lab traffic to the business API service.
  location /api/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
  location /labs/ { proxy_pass http://api:4000; proxy_set_header Host $host; }
}
