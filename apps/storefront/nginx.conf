server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Use Docker's embedded DNS so nginx starts even before the API is up,
  # resolving the upstream at request time instead of at startup.
  resolver 127.0.0.11 ipv6=off valid=10s;
  set $api_upstream http://api:4000;

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API and lab traffic to the business API service.
  location /api/  { proxy_pass $api_upstream; proxy_set_header Host $host; }
  location /labs/ { proxy_pass $api_upstream; proxy_set_header Host $host; }
}
